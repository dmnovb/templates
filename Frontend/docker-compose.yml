services:
  base:
    build:
      context: .
      dockerfile: .docker/Dockerfile.base
    image: frontend-base

  web:
    build:
      context: .
      dockerfile: .docker/local/Dockerfile.local
      args:
        BASE_IMAGE: frontend-base
    depends_on:
      - base
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    stdin_open: true
    tty: true

  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: .docker/remote/Dockerfile.remote
      args:
        BASE_IMAGE: frontend-base
    depends_on:
      - base
    ports:
      - "8080:80"
    restart: unless-stopped

  published:
    profiles: ["hub"]
    image: ${DOCKERHUB_IMAGE:-bleudechanel/frontend:latest}
    ports:
      - "8080:80"
    restart: unless-stopped
