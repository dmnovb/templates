services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    stdin_open: true
    tty: true

  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped

  published:
    profiles: ["hub"]
    image: ${DOCKERHUB_IMAGE:-bleudechanel/frontend:latest}
    ports:
      - "8080:80"
    restart: unless-stopped
